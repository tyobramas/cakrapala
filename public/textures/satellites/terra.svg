<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120">
  <defs>
    <linearGradient id="terraSolar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="60%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <linearGradient id="terraGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#713f12" />
    </linearGradient>

    <linearGradient id="terraHull" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="40%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <filter id="terraGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#terraGlow)">
    <!-- ── Single Large Solar Panel Array (Starboard side) ──────── -->
    <rect x="115" y="20" width="75" height="80" rx="3" fill="url(#terraSolar)" stroke="#2563eb" stroke-width="1.2" />
    <line x1="115" y1="46" x2="190" y2="46" stroke="#93c5fd" stroke-width="0.8" />
    <line x1="115" y1="73" x2="190" y2="73" stroke="#93c5fd" stroke-width="0.8" />
    <line x1="140" y1="20" x2="140" y2="100" stroke="#93c5fd" stroke-width="0.8" />
    <line x1="165" y1="20" x2="165" y2="100" stroke="#93c5fd" stroke-width="0.8" />
    <!-- Array boom -->
    <rect x="95" y="56" width="20" height="8" fill="#475569" stroke="#cbd5e1" stroke-width="0.8" />

    <!-- ── Main Terra Spacecraft Bus ────────────────────────────── -->
    <rect x="42" y="32" width="54" height="56" rx="4" fill="url(#terraHull)" stroke="#f8fafc" stroke-width="1.2" />

    <!-- MODIS / MISR / ASTER Instruments (Gold multi-layer insulation) -->
    <rect x="14" y="38" width="28" height="22" rx="3" fill="url(#terraGold)" stroke="#fef08a" stroke-width="0.8" />
    <circle cx="28" cy="49" r="5" fill="#0369a1" stroke="#38bdf8" stroke-width="0.8" />
    <circle cx="28" cy="49" r="2" fill="#38bdf8" />

    <!-- CERES Earth Radiation sensor (lower bay) -->
    <rect x="18" y="66" width="24" height="18" rx="2" fill="url(#terraGold)" stroke="#fef08a" stroke-width="0.8" />
    <rect x="22" y="70" width="8" height="10" fill="#0f172a" />
    <rect x="32" y="70" width="8" height="10" fill="#0f172a" />

    <!-- High Gain Communications Steerable Antenna -->
    <line x1="68" y1="32" x2="68" y2="16" stroke="#94a3b8" stroke-width="1.5" />
    <path d="M 58,16 A 10,10 0 0,1 78,16" fill="none" stroke="#e2e8f0" stroke-width="2" />
    <circle cx="68" cy="14" r="1.5" fill="#10b981" />

    <!-- Status Beacon -->
    <circle cx="90" cy="38" r="2.5" fill="#00f0ff" />
  </g>
</svg>
