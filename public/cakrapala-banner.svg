<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" width="1920" height="600" style="background:#020617; font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0c1938" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#050d24" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="1"/>
    </radialGradient>

    <!-- Cyan Glow Filter -->
    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur1"/>
      <feGaussianBlur stdDeviation="6" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Earth Linear & Radial Gradients -->
    <radialGradient id="earthAtmosphere" cx="40%" cy="40%" r="60%">
      <stop offset="70%" stop-color="#0369a1" stop-opacity="0.9"/>
      <stop offset="90%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b152e" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#050a17" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="600" fill="url(#bgGlow)"/>

  <!-- Starfield Dots (Parallax depth) -->
  <g opacity="0.75">
    <circle cx="80" cy="90" r="1.5" fill="#ffffff" opacity="0.8"/>
    <circle cx="190" cy="220" r="1" fill="#38bdf8" opacity="0.6"/>
    <circle cx="280" cy="80" r="2" fill="#ffffff" opacity="0.9"/>
    <circle cx="450" cy="150" r="1" fill="#ffffff" opacity="0.4"/>
    <circle cx="580" cy="70" r="1.5" fill="#a855f7" opacity="0.7"/>
    <circle cx="720" cy="190" r="2" fill="#38bdf8" opacity="0.8"/>
    <circle cx="890" cy="60" r="1" fill="#ffffff" opacity="0.5"/>
    <circle cx="1020" cy="110" r="2.5" fill="#ffffff" opacity="0.95"/>
    <circle cx="1180" cy="80" r="1.5" fill="#22d3ee" opacity="0.7"/>
    <circle cx="1340" cy="180" r="1" fill="#ffffff" opacity="0.4"/>
    <circle cx="1490" cy="90" r="2" fill="#ffffff" opacity="0.85"/>
    <circle cx="1650" cy="140" r="1.5" fill="#a855f7" opacity="0.6"/>
    <circle cx="1780" cy="70" r="2.5" fill="#ffffff" opacity="0.9"/>
    <circle cx="1850" cy="240" r="1" fill="#38bdf8" opacity="0.7"/>
    <!-- Lower Stars -->
    <circle cx="120" cy="480" r="2" fill="#ffffff" opacity="0.7"/>
    <circle cx="340" cy="520" r="1" fill="#ffffff" opacity="0.5"/>
    <circle cx="680" cy="490" r="1.5" fill="#38bdf8" opacity="0.6"/>
    <circle cx="950" cy="540" r="2" fill="#ffffff" opacity="0.8"/>
    <circle cx="1250" cy="510" r="1" fill="#ffffff" opacity="0.4"/>
    <circle cx="1580" cy="490" r="2.5" fill="#ffffff" opacity="0.9"/>
    <circle cx="1820" cy="530" r="1.5" fill="#22d3ee" opacity="0.8"/>
  </g>

  <!-- Constellation Geometric Lines -->
  <g opacity="0.25" stroke="#38bdf8" stroke-width="1">
    <line x1="80" y1="90" x2="190" y2="220"/>
    <line x1="190" y1="220" x2="280" y2="80"/>
    <line x1="1490" y1="90" x2="1650" y2="140"/>
    <line x1="1650" y1="140" x2="1780" y2="70"/>
    <line x1="1780" y1="70" x2="1850" y2="240"/>
  </g>

  <!-- Concentric Orbital Radar Grids -->
  <g opacity="0.2" stroke="#06b6d4" stroke-width="1.5" fill="none">
    <circle cx="480" cy="310" r="140" stroke-dasharray="4,6"/>
    <circle cx="480" cy="310" r="220" stroke-dasharray="8,8"/>
    <circle cx="480" cy="310" r="320"/>
    <line x1="160" y1="310" x2="800" y2="310" stroke-dasharray="2,4"/>
    <line x1="480" y1="0" x2="480" y2="600" stroke-dasharray="2,4"/>
  </g>

  <!-- 3D Earth Visual (Left Center) -->
  <g transform="translate(480, 310)">
    <!-- Atmosphere Rim Glow -->
    <circle cx="0" cy="0" r="92" fill="url(#earthAtmosphere)" filter="url(#cyanGlow)"/>
    <!-- Earth Base Sphere -->
    <circle cx="0" cy="0" r="82" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Continents Approximation -->
    <path d="M-40,-35 Q-15,-60 10,-45 Q35,-30 20,-10 Q5,15 -20,25 Q-55,15 -40,-35 Z" fill="#1e3a8a" opacity="0.8"/>
    <path d="M-10,10 Q20,-5 45,20 Q30,55 -5,60 Q-30,45 -10,10 Z" fill="#1e3a8a" opacity="0.8"/>
    <!-- Terminator Shadow (Day/Night) -->
    <path d="M0,-82 A82,82 0 0,1 0,82 A82,45 0 0,1 0,-82 Z" fill="#020617" opacity="0.55"/>

    <!-- Moon Orbit & Moon at 1 LD -->
    <ellipse cx="0" cy="0" rx="160" ry="60" fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.4" stroke-dasharray="3,5"/>
    <circle cx="145" cy="-25" r="14" fill="#64748b" stroke="#cbd5e1" stroke-width="1" filter="url(#cyanGlow)"/>
    <text x="145" y="6" fill="#94a3b8" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="1">1 LD (MOON)</text>
  </g>

  <!-- Hyperbolic Asteroid Trajectory & Approaching Chevron Target -->
  <g filter="url(#cyanGlow)">
    <path d="M 120,40 Q 420,180 780,480" fill="none" stroke="#ef4444" stroke-width="3" opacity="0.85" stroke-dasharray="12,6"/>
    <!-- Asteroid Rock -->
    <polygon points="340,165 352,152 368,160 364,178 348,182 336,172" fill="#ef4444" stroke="#fca5a5" stroke-width="2" filter="url(#intenseGlow)"/>
    <!-- Approaching Tactical HUD Box -->
    <rect x="250" y="85" width="220" height="52" rx="10" fill="#1e0a12" fill-opacity="0.9" stroke="#ef4444" stroke-width="2"/>
    <text x="265" y="106" fill="#fca5a5" font-size="12" font-weight="900" letter-spacing="1">⚠ PHA HAZARD &gt;&gt;</text>
    <text x="265" y="125" fill="#ffffff" font-size="13" font-weight="bold">99942 APOPHIS • 32k km/h</text>
  </g>

  <!-- Orbiting ISS Satellite -->
  <g transform="translate(420, 240)" filter="url(#cyanGlow)">
    <rect x="-16" y="-5" width="32" height="10" rx="2" fill="#38bdf8" stroke="#ffffff" stroke-width="1"/>
    <line x1="-28" y1="0" x2="28" y2="0" stroke="#38bdf8" stroke-width="2"/>
    <rect x="-38" y="-12" width="12" height="24" rx="2" fill="#0284c7" stroke="#38bdf8" stroke-width="1"/>
    <rect x="26" y="-12" width="12" height="24" rx="2" fill="#0284c7" stroke="#38bdf8" stroke-width="1"/>
    <text x="0" y="24" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">ISS (LEO 420km)</text>
  </g>

  <!-- ── Left/Center Brand Header ────────────────────────────────────────── -->
  <g transform="translate(860, 110)">
    <!-- Top Category Badge -->
    <rect x="0" y="0" width="340" height="32" rx="16" fill="#0369a1" fill-opacity="0.3" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="170" y="21" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="2">NASA &amp; NORAD 3D COCKPIT</text>

    <!-- Main Title -->
    <text x="0" y="90" fill="#ffffff" font-size="64" font-weight="900" letter-spacing="6">CAKRAPALA</text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="130" fill="#94a3b8" font-size="20" font-weight="500" letter-spacing="1.5">
      3D Space Observatory &amp; Planetary Defense Radar
    </text>
  </g>

  <!-- ── Right / Lower Feature Grid Badges ───────────────────────────────── -->
  <g transform="translate(860, 275)">
    <!-- Feature 1: Asteroid Defense Radar -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="480" height="64" rx="14" fill="url(#cardBg)" stroke="#06b6d4" stroke-width="1.5"/>
      <!-- Icon Shield -->
      <circle cx="34" cy="32" r="18" fill="#083344" stroke="#06b6d4" stroke-width="1.5"/>
      <text x="34" y="38" fill="#22d3ee" font-size="16" font-weight="bold" text-anchor="middle">🛡️</text>
      <!-- Texts -->
      <text x="68" y="26" fill="#22d3ee" font-size="14" font-weight="bold" letter-spacing="1">SYS-03 // ASTEROID DEFENSE RADAR</text>
      <text x="68" y="48" fill="#cbd5e1" font-size="12">Live NASA JPL NEOs, PHA Threat Alerts &amp; Real-World Scale</text>
    </g>

    <!-- Feature 2: Time-Travel Sky Dome -->
    <g transform="translate(505, 0)">
      <rect x="0" y="0" width="480" height="64" rx="14" fill="url(#cardBg)" stroke="#818cf8" stroke-width="1.5"/>
      <circle cx="34" cy="32" r="18" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5"/>
      <text x="34" y="38" fill="#a5b4fc" font-size="16" font-weight="bold" text-anchor="middle">🌌</text>
      <text x="68" y="26" fill="#a5b4fc" font-size="14" font-weight="bold" letter-spacing="1">SYS-02 // TIME-TRAVEL SKY DOME</text>
      <text x="68" y="48" fill="#cbd5e1" font-size="12">9,000+ Stars, IAU Constellations &amp; Historical Event Replay</text>
    </g>

    <!-- Feature 3: SGP4 NORAD Satellite Fleet -->
    <g transform="translate(0, 78)">
      <rect x="0" y="0" width="480" height="64" rx="14" fill="url(#cardBg)" stroke="#f59e0b" stroke-width="1.5"/>
      <circle cx="34" cy="32" r="18" fill="#451a03" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="34" y="38" fill="#fcd34d" font-size="16" font-weight="bold" text-anchor="middle">🛰️</text>
      <text x="68" y="26" fill="#fcd34d" font-size="14" font-weight="bold" letter-spacing="1">SYS-04 // SATELLITE FLEET RADAR</text>
      <text x="68" y="48" fill="#cbd5e1" font-size="12">NORAD SGP4 Tracking: ISS, Hubble, Tiangong &amp; Starlink</text>
    </g>

    <!-- Feature 4: IBM AI Space Co-Pilot -->
    <g transform="translate(505, 78)">
      <rect x="0" y="0" width="480" height="64" rx="14" fill="url(#cardBg)" stroke="#ec4899" stroke-width="1.5"/>
      <circle cx="34" cy="32" r="18" fill="#500724" stroke="#ec4899" stroke-width="1.5"/>
      <text x="34" y="38" fill="#f472b6" font-size="16" font-weight="bold" text-anchor="middle">🤖</text>
      <text x="68" y="26" fill="#f472b6" font-size="14" font-weight="bold" letter-spacing="1">IBM BOB &amp; GRANITE AI CO-PILOT</text>
      <text x="68" y="48" fill="#cbd5e1" font-size="12">Conversational Astrophysical Intelligence &amp; Voice Commands</text>
    </g>
  </g>

  <!-- ── Bottom Tech Bar ─────────────────────────────────────────────────── -->
  <g transform="translate(860, 465)">
    <text x="0" y="0" fill="#64748b" font-size="12" font-weight="bold" letter-spacing="2">
      CORE STACK: THREE.JS • CESIUMJS • NASA JPL NEOWS • CELESTRAK SGP4 • IBM AI • NEXT.JS 16
    </text>
  </g>
</svg>
